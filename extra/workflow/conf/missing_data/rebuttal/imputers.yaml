# Rebuttal E2b: imputation baselines for GDFS, JAFA and ODIN at MCAR p = 0.7.
# Runs in place in the v2 namespaces so the new cells share datasets,
# classifiers, base views and restoration PVAEs with the paper's cells.
methods: [gdfs, jafa, odin_model_free]
strategies:
  - restricted
  - pvae_label_conditioned
  - zero_fill
  - mean_fill
  - pvae_label_free
  - pvae_oracle
include_complete_data: true
include_method_variants: true

missingness:
  mechanisms: [mcar]
  probabilities: [0.7]

missing_data_pretrain_reuse:
  pvae:
    complete: oracle_restoration_pvae
    restricted: incomplete_restoration_pvae
