[project]
name = "afabench"
version = "1.0.0"
description = "A benchmark of active feature acquisition (AFA) methods."
readme = "README.md"
requires-python = "==3.12.10"
authors = [
  { name = "Valter Schutz", email = "valterschutz@proton.me" },
  { name = "Han Wu", email = "hanwu@chalmers.se" },
  { name = "Reza Rezvan", email = "rezvan@chalmers.se" },
  { name = "Linus Aronsson", email = "linaro@chalmers.se" },
]
dependencies = [
  "certifi>=2025.4.26",
  "coolname>=2.2.0",
  "cupy-cuda12x>=13.5.1; sys_platform == 'linux'",
  "dacite>=1.9.2",
  "httpx>=0.28.1",
  "huggingface-hub>=1.1.2",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3.2",
  "hydra-submitit-launcher>=1.2.0",
  "jaxtyping>=0.3.2",
  "lightning>=2.5.1.post0",
  "matplotlib>=3.10.1",
  "omegaconf>=2.3.0",
  "polars>=1.37.0",
  "pandera[polars]>=0.29.0",
  "plotly>=6.1.2",
  "plotnine>=0.14.0",
  "pyarrow>=23.0.0",
  "pyyaml>=6.0",
  "pytest>=8.3.5",
  "rich>=14.0.0",
  "rl-helpers>=0.7.4",
  "scikit-learn>=1.6.1",
  "seaborn>=0.13.2",
  # afabench.pipeline_plan plans through private Snakemake internals; widen
  # only after the planner's workflow tests pass on the new version
  # (ADR 0007).
  "snakemake>=9.12.0,<9.13",
  "snakemake-executor-plugin-slurm>=1.8.0",
  "textual>=8.2.8",
  "timm>=1.0.22",
  "torch>=2.7.0",
  "torchrl>=0.8.0",
  "torchvision>=0.22.0",
  "tornado>=6.5.1",
  "typer>=0.21.1",
  "ucimlrepo>=0.0.7",
  "wandb>=0.19.10",
]

[dependency-groups]
dev = [
  "basedpyright>=1.40.2",
  "csvkit>=2.1.0",
  "dvc>=3.66.1",
  "ipdb>=0.13.13",
  "ipython>=8.36.0",
  "pytest-dependency>=0.6.0",
  "pytest-watch>=4.2.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.14.8",
  "rust-just>=1.58.0",
  "visidata>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afabench"]

[tool.mypy]
follow_untyped_imports = true

# The cluster's GPU nodes are aarch64, where PyPI's torch wheels are CPU-only
# and PyPI has no triton wheel. Route aarch64 to the PyTorch index whose wheels
# are built against CUDA; x86_64 keeps PyPI's wheels, which already are. The
# constraints hold aarch64 at the versions x86_64 is locked to, so results do
# not depend on the node type, and let the triton source apply although triton
# is only a transitive dependency.
[tool.uv]
# Keep in sync with the README's prerequisites.
required-version = ">=0.10.2"
constraint-dependencies = [
  "torch==2.7.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "torchvision==0.22.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "triton==3.3.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Fail at lock time, not at install time on the cluster, when a pin lacks an
# aarch64 wheel.
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
triton = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
