hydra:
  searchpath:
    - file://conf
    - file://conf/components
    - file://conf/global

defaults:
  - train_l2m
  - hydra: custom
  - initializer: ???
  - unmasker: ???
  - dataset_key: ???
  - _self_
  - optional dataset_override@_global_: ${dataset_key}
  - override hydra/job_logging: output_dir_colorlog
  - override hydra/hydra_logging: colorlog
  - override hydra/launcher: custom_slurm

# The authors' MiniBooNE config (configs/miniboone.yaml in
# reAIM-Lab/Learning-To-Measure at the vendored commit), the family default.
# dataset_override/<dataset_key>.yaml applies the authors' dataset config.
# The architecture comes from the pretrained model bundle.

# The feature source of the pretrained model; see the pretraining config.
feature_source: real
batch_size: 8 # batch_size_afa
sequence_length: 1000 # num_points
n_steps: 50000 # num_steps_afa
policy_lr: 1e-4 # lr_selector
backbone_lr: 1e-5 # lr_backbone
temperature: 0.1 # temp
checkpoint_interval: 200 # checkpoint_interval_afa
n_validation_tasks: 200 # eval_batch_size
pretraining_pool_size: 5000 # pool_size; capped at the train split size
mixed_precision: true
context_set_size: 900 # maximum; capped at the validation split size
