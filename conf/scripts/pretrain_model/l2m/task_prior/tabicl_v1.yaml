# @package _global_
# L2M-better-synth: the TabICL v1 prior generates each
# task's features and labels with the dataset's feature and class counts;
# `prior_type` chooses its sub-priors. Four processes generate tasks ahead
# of use.
task_prior: tabicl_v1
task_workers: 4
# CHANGE FROM UPSTREAM: pretraining clips the gradient's total norm to 1.0.
# Without it, the validation loss of l2m_better_synth on metabric diverged
# after about 30,000 steps. The other task priors do not clip, as upstream.
max_grad_norm: 1.0
