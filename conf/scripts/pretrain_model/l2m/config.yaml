hydra:
  searchpath:
    - file://conf
    - file://conf/components
    - file://conf/global

defaults:
  - pretrain_l2m
  - hydra: custom
  - initializer: ???
  - unmasker: ???
  - dataset_key: ???
  - task_prior: real_pool
  - _self_
  - optional dataset_override@_global_: ${dataset_key}
  - override hydra/job_logging: output_dir_colorlog
  - override hydra/hydra_logging: colorlog
  - override hydra/launcher: custom_slurm

# The authors' MiniBooNE config (configs/miniboone.yaml in
# reAIM-Lab/Learning-To-Measure at the vendored commit), the family default.
# dataset_override/<dataset_key>.yaml sets every per-dataset value.
#
# task_prior/<name>.yaml (select with task_prior=<name>) sets task_prior,
# task_workers and max_grad_norm (gradient clipping; null = none, as
# upstream). real_pool: tasks draw instances from a pool of the train
# split's features; synthetic: every task has new uniform features on
# [-2, 2] with only the dataset's feature count (upstream's simulation
# prior); both label them with upstream's random BNN. tabicl_v1: the TabICL
# v1 prior generates features and labels with the dataset's feature and
# class counts (task_workers processes generate them ahead of use).
# pretraining_pool_size is read only by real_pool.

# The TabICL v1 prior's sub-priors: prior_bag (MLP and Gaussian process),
# prior_bag_plus_tree (adds TreeSCM) or tree_only. Read only with tabicl_v1.
prior_type: prior_bag #TODO: use the plus_tree variant
architecture:
  model_dim: 256 # d_model
  embedding_depth: 4 # emb_depth
  prediction_depth: 1 # pred_depth
  n_layers: 6 # num_layers
  n_heads: 4 # nhead
  feedforward_dim: 512 # dim_feedforward
  dropout: 0.0
batch_size: 8 # tasks per step
sequence_length: 1000 # num_points
n_steps: 50000 # num_steps
lr: 1e-4
warmup_steps: 500 # num_warmup_steps #TODO: it seems that training after warmup is wrong
checkpoint_interval: 500
n_validation_tasks: 200 # eval_batch_size
pretraining_pool_size: 5000 # pool_size; capped at the train split size
mixed_precision: true
