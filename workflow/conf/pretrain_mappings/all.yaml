# Pretraining Configuration Mapping
#
# Maps pretrained model names to their pretraining scripts and parameters.
# Each entry is identified by a unique name and specifies:
# - pretrain_script_name: The script to use for pretraining (without .py extension)
# - pretrain_params: Optional list of additional parameters to pass to the pretrain script
#
# Multiple methods can reference the same pretrained model name.

pretrain_mapping:
  pvae:
    pretrain_script_name: "odin"
    pretrain_params: []

  jafa:
    pretrain_script_name: "jafa"
    pretrain_params: []

  ol_without_mask:
    pretrain_script_name: "ol"
    pretrain_params: ["pq_module.use_feature_mask=false"]

  ol_with_mask:
    pretrain_script_name: "ol"
    pretrain_params: ["pq_module.use_feature_mask=true"]

  aaco:
    pretrain_script_name: "aaco"
    pretrain_params: []

  gdfs:
    pretrain_script_name: "gdfs"
    pretrain_params: []

  dime:
    pretrain_script_name: "dime"
    pretrain_params: []

  # The L2M runs differ in their task prior only. Everything that depends on
  # the dataset (task size, steps, pool) is in the dataset_override files of
  # conf/scripts/pretrain_model/l2m/; see docs/reference/l2m.md.
  #
  # L2M-real: tasks from the train split's features.
  l2m:
    pretrain_script_name: "l2m"
    pretrain_params: []

  # L2M-synth: tasks from upstream's simulated features, no benchmark data.
  l2m_synth:
    pretrain_script_name: "l2m"
    pretrain_params: ["task_prior=synthetic"]

  # L2M-better-synth: tasks from the TabICL v1 prior with TreeSCM.
  l2m_better_synth:
    pretrain_script_name: "l2m"
    pretrain_params:
      ["task_prior=tabicl_v1", "prior_type=prior_bag_plus_tree"]

  # Example: If you need a variant with specific parameters
  # pvae_custom:
  #   pretrain_script_name: "odin"
  #   pretrain_params:
  #     - "arg1=42"
  #     - "arg2=100"
