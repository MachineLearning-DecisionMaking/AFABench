# Preserve existing requested limits until measured durations justify changes.
walltime:
  default_hours: 4
  rules:
    train_method:
      methods:
        l2m:
          # MiniBooNE training reached ~38,000/50,000 steps in 4 hours;
          # allow headroom above the projected ~5.3-hour full run.
          # METABRIC training reached 39,600-49,600/50,000 steps in 4 hours.
          # The cube (not measured): upper bound from the GH200 durations of
          # l2m_official on miniboone_subset (10 features, 1,000 instances
          # per task), 5.2 to 5.9 hours for 50,000 steps. A cube step makes
          # 21 passes of at most 1,150 tokens in the autoregressive layout
          # (600 instances per task), against 11 of 1,950: 24,000 against
          # 21,000 tokens, so about 1.1 x 5.9 = 6.5 hours. Replace by the
          # measured duration of the first run.
          datasets:
            cube: 12
            miniboone_subset: 8
            metabric: 8
        l2m_synth:
          # Not measured: as l2m, which has the same tasks and steps.
          datasets:
            cube: 12
            miniboone_subset: 8
            metabric: 8
        l2m_better_synth:
          # Not measured: as l2m, whose tasks have the same length. A fit
          # that generates tasks in 4 worker processes may wait for them,
          # which these limits do not cover.
          datasets:
            cube: 12
            miniboone_subset: 8
            metabric: 8
    pretrain_model:
      pretrained_models:
        l2m:
          # Pretraining takes 100,000 steps on every dataset, double the
          # family default (50,000 steps ran in about 3 hours on
          # miniboone_subset), so about 6 hours there and on METABRIC.
          # The cube (not measured): an upper bound from the 3.0 hours of
          # l2m_official's pretraining on miniboone_subset (50,000 steps),
          # doubled for the steps and raised by the cube's 21 passes of a step
          # against 11; see train_method.
          datasets:
            cube: 12
            miniboone_subset: 8
            metabric: 8
        l2m_synth:
          # Not measured: as l2m.
          datasets:
            cube: 12
            miniboone_subset: 8
            metabric: 8
        l2m_better_synth:
          # Not measured: as l2m. See train_method.
          datasets:
            cube: 12
            miniboone_subset: 8
            metabric: 8

# CPU nodes are x86_64 and GPU nodes aarch64 (GH200), so each allocation
# names the venv of its nodes' architecture, which `uv run just build-venvs` builds and
# workflow/venvs/bin/python runs on those nodes.
execution_site:
  cpu:
    slurm_partition: cpu
    slurm_account: naiss2026-4-1737-cpu
    venv: .venv-x86_64
  gpu:
    slurm_partition: gpu
    slurm_account: naiss2026-4-1737-gpu
    gpu: 1
    venv: .venv-aarch64
