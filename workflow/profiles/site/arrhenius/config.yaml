# Run with uv run workflow/run.py --site arrhenius, which runs Snakemake from the
# login node's venv, after building the venv of each architecture with
# uv run just build-venvs arrhenius (docs/how-to/run_on_slurm.md).
executor: slurm
jobs: 9001
latency-wait: 30 # seconds

# Login and CPU nodes are x86_64 and GPU nodes aarch64, so each job runs in
# the venv of its node's architecture, which site.yaml names per allocation
# (ADR 0015). Without software-deployment, jobs start `python` from PATH
# rather than the login node's x86_64 interpreter: workflow/venvs/bin/python,
# which runs the node's venv. Snakemake expands $PWD and $PATH when it reads
# this profile, so run it from the checkout root.
shared-fs-usage: [persistence, input-output, sources, source-cache, storage-local-copies]
precommand: export PATH=$PWD/workflow/venvs/bin:$PATH
# Snakemake creates its Apptainer image cache even though no job uses one, in
# APPTAINER_CACHEDIR by default, which Arrhenius sets to node-local
# /scratch/local, missing on the login node.
apptainer-prefix: .snakemake/apptainer

default-resources:
  runtime: 120 # minutes
  cpus_per_task: 1
  # Below both partitions' default per CPU, so GPU jobs fit on their share
  mem_mb_per_cpu: 1400

# The partitions' time limit is 3 days.
set-resources:
  # One CPU's memory is too little for torch with CUDA on a GPU node.
  train_classifier:
    cpus_per_task: 8
  train_classifier_for_method:
    cpus_per_task: 8
  # Walltime lives in site.yaml; only explicit --set-resources overrides it.
  pretrain_model:
    cpus_per_task: 8
  train_method:
    cpus_per_task: 8
  eval_method:
    cpus_per_task: 8

  # Although the merged eval dataframes "only" take up less than 1Gb, opening them can use a lot more
  split_by_classifier_type:
    cpus_per_task: 10
  plot_eval_perf:
    cpus_per_task: 10
  plot_eval_perf_per_dataset:
    cpus_per_task: 10
  plot_eval_actions:
    cpus_per_task: 10

# For Snakemake run without the pipeline launcher, which passes this again
# with any overrides: Snakemake replaces this section with --config.
config:
  execution_site_file: workflow/profiles/site/arrhenius/site.yaml
