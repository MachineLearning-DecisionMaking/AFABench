# Which stages and methods run on CPU or GPU. Set once; independent of the
# method set and the cluster. Partitions, accounts and GPU request syntax
# belong to the site profile's site.yaml. Entries for methods a run does not
# select are ignored. See docs/how-to/maintainer/run_the_pipeline.md.
execution:
  defaults:
    classifier_training: cuda
    pretraining: cuda
    training: cpu
    evaluation: cpu
  methods:
    jafa:
      training: cuda
      evaluation: cuda
    odin_model_free:
      training: cuda
      evaluation: cuda
    odin_model_based:
      training: cuda
      evaluation: cuda
    gdfs:
      training: cuda
      evaluation: cuda
    eddi_builtin:
      training: cuda
      evaluation: cuda
    eddi_external:
      training: cuda
      evaluation: cuda
    dime:
      training: cuda
      evaluation: cuda
    l2m:
      training: cuda
      evaluation: cuda
    l2m_tabicl_prior:
      training: cuda
      evaluation: cuda
